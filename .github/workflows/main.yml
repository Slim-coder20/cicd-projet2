name: CI/CD workflow

on:
  push:

jobs:
  # ------------------------------------------------------------------
  # Job 1 : Test frontend and backend 
  # ------------------------------------------------------------------
  tests-frontend:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: ./frontend
    steps:
      - name: checkout 
        uses: actions/checkout@v4
      - name: install node 
        uses: actions/setup-node@v7
        with:
          cache: npm 
          cache-dependency-path: ./frontend/package-lock.json
      - name: install dependencies
        run: npm ci --prefer-offline
      - name: run linter 
        run: npm run lint 
      - name: npm audit 
        run: npm audit --audit-level=moderate --omit=dev

  tests-backend:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: ./node-api
    steps:
      - name: checkout 
        uses: actions/checkout@v4
      - name: install node 
        uses: actions/setup-node@v7
        with:
          cache: npm 
          cache-dependency-path: ./node-api/package-lock.json
      - name: install dependencies
        run: npm ci --prefer-offline
      - name: run linter 
        run: npm run lint 
      - name: npm audit 
        run: npm audit --audit-level=moderate
      - name: exec units test 
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        
  # ------------------------------------------------------------------
  # Job 2 : build Frontend and Node-api Backend with Matrix 
  # ------------------------------------------------------------------
  build-frontend-and-node-api:
    runs-on: ubuntu-latest
    needs: [tests-frontend, tests-backend]
    strategy: 
      matrix: 
        include:
          - context_name: ./frontend
            image_name: ghcr.io/slim-coder20/cicd-projet2/frontend:latest
          - context_name: ./node-api
            image_name: ghcr.io/slim-coder20/cicd-projet2/node-api:latest
          
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{matrix.image_name}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context_name }}
          push: true
          tags: ${{ matrix.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ------------------------------------------------------------------
  # Job 3: Test E2End
  # ------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: [build-frontend-and-node-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lancement des tests e2e  
        run: |
            docker compose up --exit-code-from cypress --abort-on-container-exit 
      - name: clean  
        run: |
            docker compose down -v --remove-orphans