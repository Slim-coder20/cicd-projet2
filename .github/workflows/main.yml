name: CI/CD workflow

on:
  push:

jobs:
  # ------------------------------------------------------------------
  # Job 1 : build Frontend and Node-api Backend with Matrix 
  # ------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    strategy: 
      matrix: 
        include:
          - context_name: ./frontend
            image_name: ghcr.io/slim-coder20/cicd-projet2/frontend:latest
          - context_name: ./node-api
            image_name: ghcr.io/slim-coder20/cicd-projet2/node-api:latest
          
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{matrix.image_name}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context_name }}
          push: true
          tags: ${{ matrix.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  